version: '3.8'\n\nservices:\n  n8n:\n    image: n8nio/n8n:latest\n    container_name: devcare-n8n\n    restart: unless-stopped\n    ports:\n      - \"5678:5678\"\n    environment:\n      - DB_TYPE=sqlite\n      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite\n      - N8N_BASIC_AUTH_ACTIVE=true\n      - N8N_BASIC_AUTH_USER=admin\n      - N8N_BASIC_AUTH_PASSWORD=devcare2024!\n      - N8N_HOST=localhost\n      - N8N_PORT=5678\n      - N8N_PROTOCOL=http\n      - WEBHOOK_URL=http://localhost:5678\n      - GENERIC_TIMEZONE=Asia/Seoul\n      # API Keys - 실제 환경에서는 .env 파일로 관리하세요\n      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}\n      - OPENAI_API_KEY=${OPENAI_API_KEY}\n      - GEMINI_API_KEY=${GEMINI_API_KEY}\n      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}\n      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}\n      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:5000}\n      - SUPABASE_URL=${SUPABASE_URL}\n      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}\n    volumes:\n      - n8n_data:/home/node/.n8n\n      - ./n8n-workflows:/workflows\n    networks:\n      - devcare-network\n    depends_on:\n      - n8n-redis\n\n  n8n-redis:\n    image: redis:7-alpine\n    container_name: devcare-redis\n    restart: unless-stopped\n    volumes:\n      - redis_data:/data\n    networks:\n      - devcare-network\n\n  # 선택사항: PostgreSQL을 n8n 데이터베이스로 사용하려는 경우\n  # n8n-postgres:\n  #   image: postgres:15\n  #   container_name: devcare-n8n-postgres\n  #   restart: unless-stopped\n  #   environment:\n  #     - POSTGRES_DB=n8n\n  #     - POSTGRES_USER=n8n\n  #     - POSTGRES_PASSWORD=n8n_password\n  #   volumes:\n  #     - postgres_data:/var/lib/postgresql/data\n  #   networks:\n  #     - devcare-network\n\nvolumes:\n  n8n_data:\n  redis_data:\n  # postgres_data:\n\nnetworks:\n  devcare-network:\n    driver: bridge"